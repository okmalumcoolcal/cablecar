<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CableCar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────── */

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-bottom: 1px solid #1c1c1c;
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      transition: background 0.4s;
    }

    .status-dot.live { background: #c53030; }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────── */

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */

    aside {
      width: 210px;
      border-right: 1px solid #1c1c1c;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-label {
      padding: 16px 16px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #444;
    }

    .channel-btn {
      display: block;
      width: 100%;
      padding: 11px 16px;
      background: none;
      border: none;
      border-left: 3px solid transparent;
      color: #888;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .channel-btn:hover {
      background: #161616;
      color: #ccc;
    }

    .channel-btn.active {
      background: #141414;
      color: #fff;
      border-left-color: #c53030;
    }

    .channel-btn .ch-name {
      display: block;
      font-weight: 500;
    }

    .channel-btn .ch-meta {
      display: block;
      font-size: 11px;
      color: #4a4a4a;
      margin-top: 2px;
    }

    .channel-btn.active .ch-meta { color: #666; }

    /* ── Main ────────────────────────────────────────────────────── */

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 36px 40px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #3a3a3a;
      margin-bottom: 22px;
    }

    .file-name {
      font-size: 21px;
      font-weight: 600;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 20px;
      word-break: break-word;
      max-width: 640px;
    }

    /* ── Meta row ────────────────────────────────────────────────── */

    .meta-row {
      display: flex;
      gap: 36px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .meta-item { display: flex; flex-direction: column; gap: 5px; }

    .meta-item .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3a3a3a;
    }

    .meta-item .value {
      font-size: 14px;
      color: #bbb;
      font-variant-numeric: tabular-nums;
    }

    /* ── Progress ────────────────────────────────────────────────── */

    .progress-track {
      width: 100%;
      max-width: 580px;
      height: 2px;
      background: #1e1e1e;
      border-radius: 1px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: #c53030;
      border-radius: 1px;
      transition: width 0.6s linear;
      width: 0%;
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      max-width: 580px;
      font-size: 11px;
      color: #3a3a3a;
      font-variant-numeric: tabular-nums;
    }

    /* ── States ──────────────────────────────────────────────────── */

    .idle-msg {
      color: #333;
      font-size: 14px;
      margin-top: 8px;
    }

    .tuning-msg { color: #444; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="status-dot" id="statusDot"></div>
  <h1>CableCar</h1>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-label">Channels</div>
    <div id="channelList"></div>
  </aside>

  <main>
    <div class="section-label">Now Playing</div>
    <div id="nowPlaying">
      <p class="idle-msg">Select a channel from the sidebar.</p>
    </div>
  </main>
</div>

<script>
  "use strict";

  let activeChannelId = null;

  /* ── Format seconds as H:MM:SS or M:SS ─────────────────────── */

  function fmt(secs) {
    if (!secs || secs <= 0) return "0:00";
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = Math.floor(secs % 60);
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    return m + ":" + String(s).padStart(2, "0");
  }

  /* ── Escape HTML ─────────────────────────────────────────────── */

  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── Load channel list ───────────────────────────────────────── */

  async function loadChannels() {
    try {
      const res  = await fetch("/api/channels");
      const data = await res.json();

      activeChannelId = data.activeChannelId;

      const list = document.getElementById("channelList");
      list.innerHTML = "";

      if (!data.channels || !data.channels.length) {
        list.innerHTML = '<div style="padding:16px;font-size:12px;color:#3a3a3a;">No channels found.<br>Scan a media folder first.</div>';
        return;
      }

      data.channels.forEach(function(ch) {
        const btn = document.createElement("button");
        btn.className = "channel-btn" + (ch.id === activeChannelId ? " active" : "");
        btn.dataset.channelId = ch.id;
        btn.innerHTML =
          '<span class="ch-name">' + esc(ch.name) + '</span>' +
          '<span class="ch-meta">' + ch.fileCount + ' file' + (ch.fileCount !== 1 ? 's' : '') + '</span>';
        btn.addEventListener("click", function() { tuneChannel(ch.id); });
        list.appendChild(btn);
      });
    } catch (e) {
      console.error("Failed to load channels:", e);
    }
  }

  /* ── Tune to channel ─────────────────────────────────────────── */

  async function tuneChannel(channelId) {
    document.querySelectorAll(".channel-btn").forEach(function(btn) {
      btn.classList.toggle("active", btn.dataset.channelId === channelId);
    });

    document.getElementById("nowPlaying").innerHTML =
      '<p class="tuning-msg">Tuning...</p>';

    try {
      await fetch("/api/tune/" + channelId, { method: "POST" });
      activeChannelId = channelId;
    } catch (e) {
      console.error("Tune failed:", e);
      document.getElementById("nowPlaying").innerHTML =
        '<p class="idle-msg">Failed to tune — check the console.</p>';
    }
  }

  /* ── Poll status ─────────────────────────────────────────────── */

  async function poll() {
    try {
      const res  = await fetch("/api/status");
      const data = await res.json();

      /* Status dot */
      document.getElementById("statusDot").classList.toggle(
        "live", data.vlc && data.vlc.state === "playing"
      );

      if (!data.schedule) return;

      const s   = data.schedule;
      const vlc = data.vlc;
      const pct = vlc.length > 0
        ? ((vlc.time / vlc.length) * 100).toFixed(1)
        : 0;

      document.getElementById("nowPlaying").innerHTML =
        '<div class="file-name">'     + esc(s.fileName)    + '</div>' +
        '<div class="meta-row">' +
          '<div class="meta-item">' +
            '<span class="label">Channel</span>' +
            '<span class="value">'  + esc(s.channelName)  + '</span>' +
          '</div>' +
          '<div class="meta-item">' +
            '<span class="label">File</span>' +
            '<span class="value">'  + (s.fileIndex + 1) + ' / ' + s.totalFiles + '</span>' +
          '</div>' +
          '<div class="meta-item">' +
            '<span class="label">State</span>' +
            '<span class="value">'  + esc(vlc.state)     + '</span>' +
          '</div>' +
          '<div class="meta-item">' +
            '<span class="label">Position</span>' +
            '<span class="value">'  + fmt(vlc.time)      + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="progress-track">' +
          '<div class="progress-fill" style="width:' + pct + '%"></div>' +
        '</div>' +
        '<div class="progress-times">' +
          '<span>' + fmt(vlc.time)   + '</span>' +
          '<span>' + fmt(vlc.length) + '</span>' +
        '</div>';

    } catch (e) {
      /* Server temporarily unavailable — leave UI as-is */
    }
  }

  /* ── Init ────────────────────────────────────────────────────── */

  loadChannels();
  poll();
  setInterval(poll, 2000);
</script>

</body>
</html>
